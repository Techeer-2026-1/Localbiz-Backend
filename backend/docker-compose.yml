services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localbiz-postgres
    environment:
      POSTGRES_DB: localbiz
      POSTGRES_USER: localbiz
      POSTGRES_PASSWORD: localbiz
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localbiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: localbiz-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=LocalBiz@Secure2026!
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localbiz-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    container_name: localbiz-promtail
    # monitoring 프로파일 — 메인 api 배포(`docker compose up api`)에 포함되지 않는다.
    # 모니터링 기동: docker compose --profile monitoring up -d promtail
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # LOKI_HOST는 .env에서 주입 (예: GCE 배포 시 모니터링 VM 내부 IP). 미설정 시 127.0.0.1.
      # 필수(:?) 문법은 compose가 파일 전체를 인터폴레이션할 때 api 단독 배포까지
      # 막으므로(api deploy는 LOKI_HOST를 모름) 기본값을 둔다. 실제 로그 푸시는
      # monitoring 프로파일 기동 시 .env의 LOKI_HOST로 결정.
      - LOKI_HOST=${LOKI_HOST:-127.0.0.1}
      # PROMTAIL_ENV는 Loki 로그 라벨에 사용 (env=production/staging/local). 미설정 시 'local'.
      - PROMTAIL_ENV=${PROMTAIL_ENV:-local}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
