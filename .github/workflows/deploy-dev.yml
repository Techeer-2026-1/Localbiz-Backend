name: Deploy to GCE (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write  # WIF OIDC 토큰 발급에 필요

# dev에 연속 머지가 몰리면 배포 런이 동시에 같은 서버에서 실행되어
# 한 런의 빌드 중 다른 런이 localbiz-api 컨테이너를 재생성 → "name already in use" 충돌.
# 같은 그룹은 직렬화하고, 진행 중 런은 완료시켜 서버 상태를 깨지 않는다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  GCE_INSTANCE: localbiz-api
  GCE_ZONE: asia-northeast3-a
  PROJECT_ID: project-e9a9c8f2-70da-411d-a51
  WIF_PROVIDER: projects/124882044304/locations/global/workloadIdentityPools/github-actions/providers/github-repo
  SA_EMAIL: github-deploy@project-e9a9c8f2-70da-411d-a51.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ① GCP 인증 (WIF — SSH key 불필요)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ①-b OS Login 비활성화 — 이 배포는 ijeong 홈(~/LocalBiz-Seoul)에서 git pull + docker compose 한다.
      # 프로젝트에 OS Login이 켜지면 배포 SA가 sa_<id> 유저로 매핑되어
      #   (1) ijeong 소유 /tmp/deploy.sh 덮어쓰기 불가 → scp Permission denied,
      #   (2) ~/LocalBiz-Seoul 접근·쓰기 불가로 배포가 깨진다.
      # 인스턴스 메타데이터로 OS Login을 끄면 gcloud가 ijeong SSH 키를 주입해 기존(정상) 경로로 복귀.
      - name: Disable OS Login on instance
        run: |
          gcloud compute instances add-metadata ${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCE_ZONE }} --project=${{ env.PROJECT_ID }} \
            --metadata enable-oslogin=FALSE --quiet

      # ② 배포 파일 준비 (runner에서 시크릿 치환)
      - name: Prepare deploy files
        run: |
          # 시크릿 파일 — 따옴표 없는 heredoc이므로 runner에서 변수 치환됨.
          # 파일명에 run_id를 붙여 서버 /tmp에서 이전 런 잔재(다른 유저 소유)와 충돌 회피.
          cat > /tmp/secrets-${{ github.run_id }}.env <<EOF
          GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
          GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}
          GOOGLE_CALENDAR_REDIRECT_URI=${GOOGLE_CALENDAR_REDIRECT_URI}
          GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
          EOF

          # 배포 스크립트 — 따옴표 있는 heredoc이므로 치환 없이 그대로 전송.
          # 시크릿 파일 경로는 실행 시 $1로 전달받는다(아래 ssh --command 참조).
          cat > /tmp/deploy-${{ github.run_id }}.sh <<'SCRIPT'
          #!/bin/bash
          set -eo pipefail
          cd ~/LocalBiz-Seoul
          git fetch origin dev && git checkout dev && git pull origin dev
          cd backend

          # 시크릿 .env에 병합 — 시크릿 파일 경로는 $1 (없으면 레거시 경로)
          SECRETS_FILE="${1:-/tmp/secrets.env}"
          if [ -f "$SECRETS_FILE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key="${line%%=*}"
              value="${line#*=}"
              if grep -q "^${key}=" .env 2>/dev/null; then
                grep -v "^${key}=" .env > .env.tmp
                echo "${key}=${value}" >> .env.tmp
                mv .env.tmp .env
              else
                echo "${key}=${value}" >> .env
              fi
            done < "$SECRETS_FILE"
            rm -f "$SECRETS_FILE"
          fi

          # Docker 정리 (디스크 부족 방지) — 미사용 이미지/캐시 제거
          docker system prune -af --filter "until=72h" || true
          docker builder prune -af || true

          # 잔재 컨테이너 강제 정리 (#148) — 이전 deploy가 중간 실패 시 남긴
          # rename 임시 컨테이너(예: <hash>_localbiz-api)와 이름 충돌 방지.
          docker ps -a --format '{{.Names}}' | grep -E '(^|_)localbiz-api$' | xargs -r docker rm -f 2>/dev/null || true

          # Docker 빌드 (수십 초 소요)
          docker compose build api

          # up 직전 재정리 — 빌드 중 다른 deploy가 남겼을 수 있는 컨테이너까지
          # 이름으로 확정 제거한 뒤 강제 재생성하여 "name already in use" 충돌 차단.
          docker rm -f localbiz-api 2>/dev/null || true
          docker compose up -d --no-deps --force-recreate --remove-orphans api

          # 헬스체크 (최대 60초)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed after 60s"
          docker compose logs --tail=50 api
          exit 1
          SCRIPT
          chmod +x /tmp/deploy-${{ github.run_id }}.sh
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REDIRECT_URI: ${{ secrets.GOOGLE_CALENDAR_REDIRECT_URI }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

      # ③ 서버에 전송 + 실행
      - name: Upload and execute deploy
        run: |
          gcloud compute scp /tmp/secrets-${{ github.run_id }}.env /tmp/deploy-${{ github.run_id }}.sh \
            ijeong@${{ env.GCE_INSTANCE }}:/tmp/ \
            --zone=${{ env.GCE_ZONE }} --project=${{ env.PROJECT_ID }} --quiet

          # 시크릿 경로를 $1로 전달. 성공/실패 무관하게 임시파일 정리 — '&&'면 실패 시
          # leftover가 남아 다음 배포 scp를 막는다(이번 사고의 직접 트리거).
          gcloud compute ssh ijeong@${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCE_ZONE }} --project=${{ env.PROJECT_ID }} --quiet \
            --command="bash /tmp/deploy-${{ github.run_id }}.sh /tmp/secrets-${{ github.run_id }}.env; rc=\$?; rm -f /tmp/deploy-${{ github.run_id }}.sh /tmp/secrets-${{ github.run_id }}.env; exit \$rc"
