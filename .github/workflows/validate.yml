name: validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: validate.sh (6 stages)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: localbiz
          POSTGRES_PASSWORD: localbiz
          POSTGRES_DB: localbiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: localbiz
      DB_USER: localbiz
      DB_PASSWORD: localbiz
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "10080"
      GOOGLE_CLIENT_ID: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply DB migrations (init_db.sql + users v2 schema)
        working-directory: backend
        run: |
          # 1) init_db.sql 적용 (v1 스키마)
          PGPASSWORD=localbiz psql -h localhost -U localbiz -d localbiz \
            -v ON_ERROR_STOP=1 \
            -f scripts/init_db.sql

          # 2) users v1→v2 마이그레이션
          PGPASSWORD=localbiz psql -h localhost -U localbiz -d localbiz \
            -v ON_ERROR_STOP=1 \
            -f scripts/migrate_users_v2.sql

      - name: Run validate.sh (6 stages)
        run: ./validate.sh

      - name: Check no absolute path leaks in hooks/settings
        run: |
          if grep -l "/Users/ijeong/Desktop" .claude/hooks/*.sh .claude/settings.json validate.sh 2>/dev/null; then
            echo "::error::Absolute path leaked in shared hooks/settings — must use \$CLAUDE_PROJECT_DIR or \$PROJECT_ROOT"
            exit 1
          fi
